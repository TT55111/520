[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weekly-report-agent"
version = "1.0.0"
description = "多平台内容自动整理与周报生成 Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TT" }]
keywords = ["weekly-report", "git", "github", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
weekly-report = "weekly_report_agent.cli:main"

[project.urls]
Homepage = "https://github.com/TT55111/weekly-report-agent"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/weekly_report_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
